[package]
name = "evolve-messenger"
version = "1.0.4"
description = "Evolve Messenger - the Evolve team chat as its own desktop app"
authors = ["Evolve Systems"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-shell = "2.2"
tauri-plugin-updater = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
